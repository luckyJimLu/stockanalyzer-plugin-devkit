name: Release packages

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: mkdir -p artifacts && npm pack --workspace @stockanalyzer/plugin-contracts --pack-destination artifacts && npm pack --workspace @stockanalyzer/plugin-sdk --pack-destination artifacts && npm pack --workspace @stockanalyzer/plugin-core --pack-destination artifacts && npm pack --workspace @stockanalyzer/plugin-cli --pack-destination artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
